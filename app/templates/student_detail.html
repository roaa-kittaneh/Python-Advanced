{% extends "base.html" %}
{% block content %}
    <h2>Student Details: {{ student.name }}</h2>
    <p><strong>ID:</strong> {{ student.student_id }}</p>
    <p><strong>Grades:</strong> {{ student.grades }}</p>
    <p><strong>GPA:</strong> {{ student.gpa | round(2) }}</p>
    
    <p><strong>Status:</strong> 
        {% if student.is_passing %}
            <span style="color: green;">Passing</span>
        {% else %}
            <span style="color: red;">Failing</span>
        {% endif %}
    </p>
    <br>
    
    <hr>
    
    <a href="{{ url_for('students.edit_student', student_id=student.student_id) }}">
        <button>Edit Student</button>
    </a>

    <form action="{{ url_for('students.delete_student', student_id=student.student_id) }}" method="POST" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this student?');" style="color: red;">Delete Student</button>
    </form>

    <br><br>
    <a href="{{ url_for('students.list_students') }}">Back to Students List</a>
{% endblock %}
