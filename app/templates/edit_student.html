{% extends "base.html" %}

{% block content %}
<h2>Edit Student: {{ student.name }}</h2>

<form method="POST">
    <label>Student ID:</label>
    <input type="text" value="{{ student.student_id }}" disabled><br><br>

    <label>Name:</label>
    <input type="text" name="name" value="{{ student.name }}" required><br><br>

    <label>Grades (comma separated):</label>
    <input type="text" name="grades" value="{{ student.grades }}"><br><br>

    <button type="submit">Save Changes</button>
    <a href="{{ url_for('students.student_detail', student_id=student.student_id) }}">Cancel</a>
</form>
{% endblock %}
